<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christ Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Das Handy-Gehäuse (Passt sich auf echten Smartphones automatisch als Vollbild an!) */
        .phone-container {
            width: 100%; max-width: 410px; height: 840px; background-color: #1a1a1a;
            border: 8px solid #2a2a2a; border-radius: 36px; display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        /* Automatisches Vollbild für echte Smartphones */
        @media (max-width: 450px) {
            .phone-container {
                max-width: 100%; width: 100vw; height: 100vh;
                border: none; border-radius: 0; box-shadow: none;
            }
        }
        
        /* Obere Leiste */
        .app-bar { 
            background-color: #261c38; padding: 20px; text-align: center; font-size: 1.2rem; 
            font-weight: bold; border-bottom: 1px solid #33254c; flex-shrink: 0; position: relative; 
        }
        
        .back-btn { 
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #b388ff; font-size: 1.1rem; cursor: pointer; display: none; 
        }
        
        /* Der scrollbare Hauptbereich */
        .app-content { flex: 1; padding: 20px; overflow-y: auto; position: relative; }
        
        /* Screens */
        .screen { display: none; height: 100%; position: relative; }
        .screen.active { display: block; }

        .card { background-color: rgba(103, 58, 183, 0.15); border: 1px solid rgba(103, 58, 183, 0.3); border-radius: 16px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .card-title { color: #b388ff; font-weight: bold; margin-top: 10px; display: block; }
        .btn { background-color: #673ab7; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* Feed System (Vollbild-Scrollen) */
        .feed-stream { overflow-y: scroll; scroll-snap-type: y mandatory; height: 100%; scroll-behavior: smooth; }
        .feed-item { height: 100%; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 35px; text-align: center; position: relative; box-shadow: inset 0 0 100px rgba(0,0,0,0.8); flex-shrink: 0; }
        
        .bg-gradient-1 { background: linear-gradient(135deg, #2e1c47, #141b41); }
        .bg-gradient-2 { background: linear-gradient(135deg, #42123c, #261c38); }
        .bg-gradient-3 { background: linear-gradient(135deg, #0d3b40, #072624); }
        .bg-gradient-user { background: linear-gradient(135deg, #1f3c3d, #261c38); }
        
        .feed-verse { font-size: 1.35rem; font-style: italic; line-height: 1.6; margin-bottom: 20px; word-break: break-word; }
        .feed-author { color: #b388ff; font-weight: bold; font-size: 1rem; }
        .quiz-option { background-color: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.15); color: white; padding: 14px; border-radius: 12px; width: 100%; margin-top: 12px; cursor: pointer; font-size: 0.95rem; text-align: center; transition: all 0.2s; }

        /* Bibel & Listen-Design */
        .bible-section-title { font-size: 1.1rem; color: #b388ff; margin: 20px 0 10px 0; font-weight: bold; border-bottom: 1px solid #33254c; padding-bottom: 5px; }
        .list-item { background-color: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item-title { font-size: 1rem; font-weight: 500; color: white; text-align: left; }
        .list-item-sub { font-size: 0.8rem; color: #888; margin-top: 4px; text-align: left; }
        .chapter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .chapter-box { background-color: #261c38; border: 1px solid #673ab7; color: white; padding: 12px; border-radius: 8px; cursor: pointer; text-align: center; }
        .bible-text { font-size: 1.1rem; line-height: 1.6; white-space: pre-line; text-align: left; }

        /* Die Plus-Buttons (Schweben perfekt im jeweiligen Screen) */
        .fab { position: absolute; right: 20px; bottom: 20px; width: 56px; height: 56px; background-color: #b388ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: black; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 15; }

        /* Navigationsleiste (FEST verankert am unteren Rand des Containers) */
        .bottom-nav { 
            background-color: #1a1a1a; border-top: 1px solid #2a2a2a; 
            display: flex; justify-content: space-around; align-items: center; 
            height: 65px; flex-shrink: 0; width: 100%;
        }
        .nav-item { color: #888; cursor: pointer; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #b388ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-bar">
            <button class="back-btn" id="bible-back-btn" onclick="goBackInBible()">◀</button>
            <span id="app-bar-title">Dein Tagesimpuls</span>
        </div>

        <div class="app-content" id="main-content-area">
            
            <div id="screen-impuls" class="screen active">
                <div class="card" id="impuls-card-content">Lade Impuls...</div>
                <button class="btn" onclick="alert('Schön, dass du dir heute Zeit für Gott nimmst!')">Heute darüber nachdenken</button>
            </div>

            <div id="screen-feed" class="screen">
                <div class="feed-stream" id="feed-stream-container"></div>
                <div class="fab" style="background-color: #673ab7; color: white;" onclick="openFeedModal()">+</div>
            </div>

            <div id="screen-bibel" class="screen">
                <div style="margin-bottom: 15px; display: flex; gap: 8px;">
                    <input type="text" id="bible-search-input" placeholder="Wort suchen (z.B. Liebe)..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #673ab7; background: #222; color: white;">
                    <button class="btn" style="width: auto; margin-top: 0; padding: 10px 15px;" onclick="searchBible()">🔍</button>
                </div>
                <div id="bible-search-results" style="display: none; margin-bottom: 20px;">
                    <h3 style="color: #b388ff; margin-bottom: 10px;">Suchergebnisse:</h3>
                    <div id="search-results-container"></div>
                    <button class="btn" style="background-color: #333;" onclick="clearSearch()">Suche schließen</button>
                    <hr style="border-color: #33254c; margin-top: 15px; margin-bottom: 15px;">
                </div>
                <div id="bible-main-views">
                    <div id="bible-books-view"></div>
                    <div id="bible-chapters-view" style="display: none;">
                        <h3 id="selected-book-title">Buch</h3>
                        <div class="chapter-grid" id="chapter-grid-container"></div>
                    </div>
                    <div id="bible-text-view" style="display: none;">
                        <h3 id="bible-passage-title" style="color: #b388ff; margin-bottom: 15px;">Kapitel</h3>
                        <div class="bible-text" id="bible-text-container"></div>
                    </div>
                </div>
            </div>

            <div id="screen-community" class="screen">
                <h3 style="margin-bottom: 15px;">Gebetswand</h3>
                <div id="prayer-wall-container">
                    <div class="list-item">
                        <div>
                            <div class="list-item-title">„Bitte betet für meine Oma, sie ist im Krankenhaus.“</div>
                            <div class="list-item-sub">Vor 2 Stunden • Anonym</div>
                        </div>
                        <button style="background: none; border: none; color: #ff9800; font-size: 1.2rem;" onclick="prayCounter(this)">🔥 1</button>
                    </div>
                </div>
                <div class="fab" onclick="addPrayer()">+</div>
            </div>

            <div id="screen-profil" class="screen">
                <div id="profil-content">
                    </div>
            </div>

        </div> <div id="feed-upload-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18,18,18,0.98); z-index: 100; padding: 25px; flex-direction: column; justify-content: center;">
            <h3 style="color: #b388ff; margin-bottom: 20px; text-align: center; font-size: 1.4rem;">Teile ein Wort Gottes</h3>
            <label style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">Welcher Vers ist es?</label>
            <input type="text" id="modal-feed-title" placeholder="z.B. Johannes 3,16" style="width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #673ab7; color: white; border-radius: 8px; font-size: 1rem;">
            <label style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">Der Vers-Text:</label>
            <textarea id="modal-feed-text" placeholder="Schreibe hier den Bibelvers..." rows="5" style="width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #673ab7; color: white; border-radius: 8px; resize: none; font-size: 1rem;"></textarea>
            <label style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">Dein Name:</label>
            <input type="text" id="modal-feed-author" placeholder="Anonym oder dein Name" style="width: 100%; padding: 12px; margin-bottom: 25px; background: #222; border: 1px solid #673ab7; color: white; border-radius: 8px; font-size: 1rem;">
            <button class="btn" onclick="submitNewFeedItem()">In den Feed posten ✨</button>
            <button class="btn" style="background: #333; margin-top: 10px;" onclick="closeFeedModal()">Abbrechen</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchScreen('impuls', 'Dein Tagesimpuls', this)"><span>⚡</span><span>Impuls</span></div>
            <div class="nav-item" onclick="switchScreen('feed', 'Entdecken', this)"><span>📱</span><span>Feed</span></div>
            <div class="nav-item" onclick="switchScreen('bibel', 'Die Bibel', this)"><span>📖</span><span>Bibel</span></div>
            <div class="nav-item" onclick="switchScreen('community', 'Community', this)"><span>❤️</span><span>Community</span></div>
            <div class="nav-item" onclick="switchScreen('profil', 'Mein Profil', this)"><span>👤</span><span>Profil</span></div>
        </div>
    </div> <script src="impuls.js"></script>
    <script src="feed.js"></script>
    <script src="bibel.js"></script>
    <script src="profil.js"></script>
    
    <script>
        function switchScreen(screenId, title, navElement) {
            // Alle Bildschirme unsichtbar machen
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            
            // Gewünschten Bildschirm aktivieren
            const targetScreen = document.getElementById('screen-' + screenId);
            if(targetScreen) targetScreen.classList.add('active');
            
            // Titel ändern
            document.getElementById('app-bar-title').innerText = title;
            
            // Navigations-Status anpassen
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(navElement) navElement.classList.add('active');

            // Abstände für den Feed korrigieren
            let contentArea = document.getElementById('main-content-area');
            if(contentArea) {
                contentArea.style.padding = (screenId === 'feed') ? '0' : '
